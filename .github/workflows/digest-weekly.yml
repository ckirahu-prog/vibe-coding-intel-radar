name: Weekly Digest

# 周五 22:00 UTC = 北京时间周六 06:00，跑在 Weekly Automation（周六 09:00 北京）之前
# 免费规则脚本：去重聚类 + 评分选 top-80，写入 data/weekly-digest/YYYY-Www.json
on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build weekly digest
        run: python scripts/digest_weekly.py --days 7 --top 80

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly-digest/
          if git diff --staged --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "chore(intel): weekly digest $(date -u +%Y-W%V)"
            git push
          fi
